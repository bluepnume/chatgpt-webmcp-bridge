name: Demo pages

# Publishes examples/ to GitHub Pages, where the panel's Try button opens the
# demo shop: https://bluepnume.github.io/chatgpt-webmcp-bridge/examples/shop/
on:
  push:
    branches: [ main ]
    paths: [ 'examples/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && cp -R examples _site/examples
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
